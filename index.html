<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/src/assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/src/assets/favicon-16x16.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7faf8" />
    <script>
      (() => {
        let preference = "system";
        try {
          const stored = localStorage.getItem("deckly-theme");
          if (stored === "dark" || stored === "light" || stored === "system") {
            preference = stored;
          }
        } catch {}
        const systemDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
        const theme = preference === "system" ? (systemDark ? "dark" : "light") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#111413" : "#f7faf8",
        );
      })();
    </script>
    <title>Deckly | Secure Pitch Deck Sharing</title>
    <meta
      name="description"
      content="Deckly: Professional data rooms for your startup pitch decks."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
