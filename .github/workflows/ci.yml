name: CI - Lint, Test and Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Linting
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build
        env:
          # We need these to exist for the build to pass if Vite uses them
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'placeholder' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
