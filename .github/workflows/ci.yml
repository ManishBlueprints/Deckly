name: CI - Lint, Test and Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI must never initialize browser clients against a real Supabase project.
      # Playwright additionally blocks external HTTP(S) requests.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Check Linting
        run: npm run lint

      - name: Check UI tokens
        run: npm run check:ui-tokens

      - name: Run Tests
        run: npm test

      - name: Build Storybook
        run: npm run storybook:build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run visual tests
        run: npm run test:visual

      - name: Run system theme tests
        run: npm run test:theme

      - name: Run Build
        run: npm run build
